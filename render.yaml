# Render Blueprint: New → Blueprint → pick this repo.
# Free setup: Render free web service + a free Turso database (https://turso.tech).
services:
  - type: web
    name: aussie-energy-savers
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TURSO_DATABASE_URL
        sync: false # libsql://<your-db>.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL
        sync: false # e.g. https://aussie-energy-savers.onrender.com
      - key: SEED_DEMO
        value: "false"
